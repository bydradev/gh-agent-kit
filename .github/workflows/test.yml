name: test

# The MCP server's, the workflow steps' and the installer's tests (tests/).
# Nothing here is installed into a target: kit-manifest.txt does not list
# this file.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The installer tests clone this checkout and install from
          # commits in that clone.
          fetch-depth: 0
          persist-credentials: false
      # The runner's own Node, as the review and triage workflows use to run
      # the MCP server.
      - name: Test the MCP server and the workflow steps
        run: |
          node --version
          node --test tests/*.test.mjs
      - name: Test the installer
        run: bash tests/install.test.sh
      # Targets run Prettier over the files the kit installs into them, with
      # gh-repo-bootstrapper's Next.js settings (templates/.prettierrc.json:
      # printWidth 100 and trailingComma all; the rest are Prettier's
      # defaults), which .github/prettierrc.json repeats. The template
      # ignores *.md, so the skills are left out.
      - name: Check the installed JavaScript and YAML with the targets' Prettier settings
        run: |
          files=$(grep -v -e '^#' -e '^$' kit-manifest.txt | sed 's/^seed //' | grep -E '\.(mjs|js|ya?ml)$')
          npx --yes prettier@3.9.10 --config .github/prettierrc.json --check $files
