name: issue-triage

# Claude triages issues on the API key in ANTHROPIC_API_KEY (or, with
# KIT_TRIAGE_PROVIDER=opencode-go, on an OpenCode Go model and the key in
# OPENCODE_API_KEY), following the github-issue-triage skill, through
# Claude Code or, on Go unless KIT_TRIAGE_RUNNER says claude-code,
# OpenCode's CLI. It is off until KIT_ISSUE_TRIAGE, a repository variable
# or a line of .github/gh-agent-kit.yml (the settings job below), is "on",
# like the other workflows' switches; "off" (or unset) leaves it off, the
# weekly sweep included, and any other value fails the run.

on:
  issues:
    # "opened" runs only for an issue created without needs-triage (outside
    # the forms); a form issue fires "labeled" with needs-triage instead, so
    # each creation starts exactly one run.
    types: [opened, edited, reopened, labeled]
  schedule:
    - cron: "13 6 * * 1" # weekly sweep, Monday 06:13 UTC
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to triage, or empty for a sweep
        required: false
        type: number

# An explicit bash shell runs every step with pipefail (GitHub's workflow
# syntax docs: an unspecified shell is bash -e, bash adds -o pipefail), so a
# failed gh call at the head of a pipeline fails the step instead of
# producing an empty, green result.
defaults:
  run:
    shell: bash

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: write # the sweep dispatches one run per issue

jobs:
  # The settings the triage job runs with. Its if: and timeout-minutes can
  # read only repository variables and earlier jobs' outputs (GitHub's
  # context availability table, read 2026-10-26), and a setting may come
  # from .github/gh-agent-kit.yml instead of a variable (the kit's setup
  # guide, https://github.com/bydradev/gh-agent-kit/blob/main/docs/setup.md),
  # so this job reads both, checks each value and passes them on.
  settings:
    name: issue-triage settings
    # A group of its own, with the triage job's cancel rule: a newer run
    # cancels an older one still reading its settings, so the older one's
    # triage job never starts after the newer one's and cancels it.
    concurrency:
      group: issue-triage-settings-${{ github.event.issue.number || github.event.inputs.issue || 'sweep' }}
      cancel-in-progress: true
    # The triage job's filters, so an event it skips costs no runner
    # either. Skip bot-authored issues (a CI notifier's, for example), and on a
    # "labeled" event run only when the label applied is needs-triage.
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.state == 'open' &&
        github.event.issue.user.type != 'Bot' &&
        (github.event.action != 'labeled' || github.event.label.name == 'needs-triage') &&
        (github.event.action != 'opened' || !contains(github.event.issue.labels.*.name, 'needs-triage')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      SETTINGS: >-
        KIT_ISSUE_TRIAGE
        KIT_TRIAGE_PROVIDER
        KIT_TRIAGE_RUNNER
        KIT_TRIAGE_MODEL
        KIT_TRIAGE_EFFORT
        KIT_TRIAGE_MAX_TURNS
        KIT_TRIAGE_TIMEOUT_MINUTES
    outputs:
      KIT_ISSUE_TRIAGE: ${{ steps.pass.outputs.KIT_ISSUE_TRIAGE }}
      KIT_TRIAGE_PROVIDER: ${{ steps.pass.outputs.KIT_TRIAGE_PROVIDER }}
      KIT_TRIAGE_RUNNER: ${{ steps.pass.outputs.KIT_TRIAGE_RUNNER }}
      KIT_TRIAGE_MODEL: ${{ steps.pass.outputs.KIT_TRIAGE_MODEL }}
      KIT_TRIAGE_EFFORT: ${{ steps.pass.outputs.KIT_TRIAGE_EFFORT }}
      KIT_TRIAGE_MAX_TURNS: ${{ steps.pass.outputs.KIT_TRIAGE_MAX_TURNS }}
      KIT_TRIAGE_TIMEOUT_MINUTES: ${{ steps.pass.outputs.KIT_TRIAGE_TIMEOUT_MINUTES }}
    steps:
      # Setting by setting, a repository variable wins over the file, so a
      # variable still changes a setting at once, without a pull request.
      # The same script in each of the kit's workflows.
      - name: Read the settings file and variables
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VARS: ${{ toJSON(vars) }}
        run: |
          # Every setting the kit reads, in any of its workflows; the file may
          # set any of them, and a name outside this list fails the run.
          # Secrets (ANTHROPIC_API_KEY, OPENCODE_API_KEY) are not settings.
          known=(
            KIT_REVIEW_MODE KIT_REVIEW_PROVIDER KIT_REVIEW_RUNNER KIT_REVIEW_MODEL
            KIT_REVIEW_EFFORT KIT_REVIEW_MAX_TURNS KIT_REVIEW_TIMEOUT_MINUTES
            KIT_REVIEW_MAX_FILES KIT_REVIEW_MAX_LINES
            KIT_SECURITY_SCAN KIT_SECURITY_PROVIDER KIT_SECURITY_RUNNER KIT_SECURITY_MODEL
            KIT_SECURITY_EFFORT KIT_SECURITY_MAX_TURNS KIT_SECURITY_TIMEOUT_MINUTES
            KIT_SECURITY_MAX_FILES KIT_SECURITY_MAX_LINES
            KIT_ISSUE_TRIAGE KIT_TRIAGE_PROVIDER KIT_TRIAGE_RUNNER KIT_TRIAGE_MODEL
            KIT_TRIAGE_EFFORT KIT_TRIAGE_MAX_TURNS KIT_TRIAGE_TIMEOUT_MINUTES
            KIT_UPDATE_CHECK
          )
          file=.github/gh-agent-kit.yml
          # The file on the default branch (the contents API's default ref),
          # never a pull request's head: a pull request cannot change its own
          # review or scan, and a change to the file applies once merged, as a
          # variable's does. No file is no setting; any other failure to read
          # it fails the run rather than running with the defaults.
          err=$(mktemp)
          if content=$(gh api "repos/$REPO/contents/$file" \
            --jq 'if .type != "file" then error("not a file") elif .size > 16384 then error("larger than 16 KiB") else .content end' 2> "$err"); then
            content=$(printf '%s' "$content" | base64 -d)
            echo "read $file from the default branch"
          elif grep -q 'HTTP 404' "$err"; then
            content=""
            echo "no $file on the default branch"
          else
            echo "::error::could not read $file from the default branch: $(head -c 300 "$err")"
            exit 1
          fi
          # One "NAME: value" line per setting, a value being a word or a
          # number, quoted or not; comments and blank lines are skipped.
          # Anything else fails the run naming the line, and a line is never
          # printed: one that is not a setting could hold a secret.
          declare -A value=() at=()
          word='[A-Za-z0-9._-]'
          pair="^[[:space:]]+(\"($word*)\"|'($word*)'|($word+))([[:space:]]+#.*)?[[:space:]]*\$|^([[:space:]]+#.*)?[[:space:]]*\$"
          n=0
          while IFS= read -r l || [ -n "$l" ]; do
            n=$((n + 1))
            l=${l%$'\r'}
            if [[ "$l" =~ ^[[:space:]]*(#.*)?$ ]] || { [ "$l" = "---" ] && [ "${#at[@]}" -eq 0 ]; }; then
              continue
            fi
            if ! [[ "$l" =~ ^([A-Z][A-Z0-9_]*):(.*)$ ]]; then
              echo "::error::$file line $n is not a NAME: value line"
              exit 1
            fi
            name=${BASH_REMATCH[1]} rest=${BASH_REMATCH[2]}
            if [[ " ${known[*]} " != *" $name "* ]]; then
              case "$name" in
                *KEY* | *TOKEN* | *SECRET* | *PASSWORD*)
                  echo "::error::$file line $n names a secret; secrets go in the repository's Actions secrets, never in a committed file" ;;
                KIT_*)
                  echo "::error::$file line $n: $name is not a setting the kit reads (the kit's setup guide lists them)" ;;
                *)
                  echo "::error::$file line $n is not a kit setting" ;;
              esac
              exit 1
            fi
            if [ -n "${at[$name]:-}" ]; then
              echo "::error::$file sets $name twice, on lines ${at[$name]} and $n"
              exit 1
            fi
            if ! [[ "$rest" =~ $pair ]]; then
              echo "::error::$file line $n: $name must be one word or number, quoted or not"
              exit 1
            fi
            value[$name]=${BASH_REMATCH[2]}${BASH_REMATCH[3]}${BASH_REMATCH[4]}
            at[$name]=$n
          done <<< "$content"
          # Each setting this workflow reads: the repository variable when
          # set, else the file's value, else unset (the kit's default). Every
          # legitimate value is a word or a number, so anything else fails
          # here, before it reaches GITHUB_ENV, where a line break would set
          # another variable.
          for name in $SETTINGS; do
            v=$(jq -r --arg name "$name" '.[$name] // ""' <<< "${VARS:-{\}}")
            if [ -n "$v" ]; then
              from="the repository variable"
            elif [ -n "${value[$name]:-}" ]; then
              v=${value[$name]}
              from="$file line ${at[$name]}"
            else
              from="unset"
            fi
            if ! [[ "$v" =~ ^$word*$ ]]; then
              echo "::error::the setting $name must be one word or number, as the kit's setup guide lists ($from)"
              exit 1
            fi
            # A switch takes only the values that name a state, so a typo
            # fails the run instead of quietly leaving its workflow off.
            case "$name" in
              KIT_REVIEW_MODE | KIT_SECURITY_SCAN) states="push open off" ;;
              KIT_ISSUE_TRIAGE | KIT_UPDATE_CHECK) states="on off" ;;
              *) states="" ;;
            esac
            if [ -n "$states" ] && [ -n "$v" ] && [[ " $states " != *" $v "* ]]; then
              echo "::error::the setting $name must be ${states// /, } or unset, not '$v' ($from)"
              exit 1
            fi
            echo "$name=$v" >> "$GITHUB_ENV"
            echo "FROM_$name=$from" >> "$GITHUB_ENV"
            echo "$name=${v:-(unset)} ($from)"
          done
      # Each setting the step above read, checked here and passed on with
      # the kit's default when unset, only while the triage is on; a value
      # out of range fails the run, naming where it came from, rather than
      # running with something else.
      - name: Read the triage settings
        if: env.KIT_ISSUE_TRIAGE == 'on'
        env:
          PROVIDER: ${{ env.KIT_TRIAGE_PROVIDER }}
          RUNNER: ${{ env.KIT_TRIAGE_RUNNER }}
          MODEL: ${{ env.KIT_TRIAGE_MODEL }}
          EFFORT: ${{ env.KIT_TRIAGE_EFFORT }}
          MAX_TURNS: ${{ env.KIT_TRIAGE_MAX_TURNS }}
          TIMEOUT: ${{ env.KIT_TRIAGE_TIMEOUT_MINUTES }}
        run: |
          # Where a setting's value came from, for the errors below.
          from() { local v="FROM_$1"; printf '%s' "${!v:-unset}"; }
          # A whole number from 1 to the maximum, or the default when unset.
          number() {
            local name=$1 value=$2 default=$3 max=$4
            [ -n "$value" ] || value=$default
            if ! [[ "$value" =~ ^[1-9][0-9]*$ ]] || [ "${#value}" -gt 6 ] || [ "$value" -gt "$max" ]; then
              echo "::error::the setting $name must be a whole number from 1 to $max, not '$value' ($(from "$name"))"
              exit 1
            fi
            echo "$name=$value" >> "$GITHUB_ENV"
            echo "$name=$value"
          }
          # A Claude model name, or the default when unset.
          model() {
            local name=$1 value=$2 default=$3
            [ -n "$value" ] || value=$default
            if ! [[ "$value" =~ ^claude-[a-z0-9.-]+$ ]]; then
              echo "::error::the setting $name must be a Claude model name such as $default, not '$value' ($(from "$name"))"
              exit 1
            fi
            echo "$name=$value" >> "$GITHUB_ENV"
            echo "$name=$value"
          }
          # An OpenCode Go model id, or the default when unset. Claude Code
          # speaks only the Anthropic Messages API, so the id must be one Go
          # serves on its anthropic/v1/messages endpoint; another fails at
          # the model step on the claude-code runner. OpenCode's CLI takes
          # any of Go's endpoints, for the models its pinned release lists
          # (the run fetches no newer list, so another fails at the model
          # step). Go's endpoint table is not the whole list: the default
          # answered on the Anthropic endpoint on 2026-10-25 though the table
          # names only the OpenAI-style endpoint for it (the kit's setup
          # guide,
          # https://github.com/bydradev/gh-agent-kit/blob/main/docs/setup.md#opencode-go).
          # Go's -contributor models train on prompts, so they are refused.
          go_model() {
            local name=$1 value=$2 default=$3
            [ -n "$value" ] || value=$default
            if ! [[ "$value" =~ ^[a-z0-9][a-z0-9.-]*$ ]]; then
              echo "::error::the setting $name must be an OpenCode Go model id such as $default, not '$value' ($(from "$name"))"
              exit 1
            fi
            if [[ "$value" == *-contributor ]]; then
              echo "::error::the setting $name names a Go Contributor model, which trains on prompts (opencode.ai/docs/go); choose another, not '$value' ($(from "$name"))"
              exit 1
            fi
            echo "$name=$value" >> "$GITHUB_ENV"
            echo "$name=$value"
          }
          # An effort level the CLI takes, or none when unset: the run then
          # passes no --effort (no --variant on OpenCode) and the CLI's
          # default for the model applies. Claude Code ignores an unknown
          # level with a warning and OpenCode an unknown variant silently,
          # so it fails here, and on OpenCode a level the model lacks fails
          # the run step.
          effort() {
            local name=$1 value=$2
            if [ -n "$value" ] && ! [[ "$value" =~ ^(low|medium|high|xhigh|max)$ ]]; then
              echo "::error::the setting $name must be low, medium, high, xhigh or max, not '$value' ($(from "$name"))"
              exit 1
            fi
            echo "$name=$value" >> "$GITHUB_ENV"
            echo "$name=${value:-(unset, so the CLI default)}"
          }
          # The program that runs the skill. Unset, it follows the provider:
          # OpenCode's CLI on OpenCode Go and Claude Code on the Anthropic
          # API (OpenCode's CLI runs only on Go here). Claude Code can run on
          # Go through Go's Anthropic endpoint, but it thinks far longer
          # there: 10k to 34k tokens a turn and a review past the time limit,
          # against under 2k a step on average and 7 minutes in OpenCode's
          # CLI (the kit's setup guide,
          # https://github.com/bydradev/gh-agent-kit/blob/main/docs/setup.md#opencode-go,
          # measured 2026-10-28), so it warns. The runner is read first, so
          # an opencode runner without the Go provider is named as such, not
          # as a model the provider does not take. On OpenCode the effort
          # level becomes the model's --variant, which the run step checks
          # against the pinned CLI's model list.
          case "$RUNNER" in
            '')
              runner=claude-code
              [ "$PROVIDER" != opencode-go ] || runner=opencode ;;
            claude-code)
              runner=claude-code
              if [ "$PROVIDER" = opencode-go ]; then
                echo "::warning::the setting KIT_TRIAGE_RUNNER is claude-code on OpenCode Go, where Claude Code runs Go's models slower than OpenCode's CLI; the kit recommends leaving it unset ($(from KIT_TRIAGE_RUNNER))"
              fi ;;
            opencode)
              if [ "$PROVIDER" != opencode-go ]; then
                echo "::error::the setting KIT_TRIAGE_RUNNER is opencode, which needs KIT_TRIAGE_PROVIDER set to opencode-go, not '${PROVIDER:-unset}' ($(from KIT_TRIAGE_RUNNER); KIT_TRIAGE_PROVIDER: $(from KIT_TRIAGE_PROVIDER))"
                exit 1
              fi
              runner=opencode ;;
            *)
              echo "::error::the setting KIT_TRIAGE_RUNNER must be claude-code, opencode or unset, not '$RUNNER' ($(from KIT_TRIAGE_RUNNER))"
              exit 1 ;;
          esac
          echo "KIT_TRIAGE_RUNNER=$runner" >> "$GITHUB_ENV"
          echo "KIT_TRIAGE_RUNNER=$runner"
          case "$PROVIDER" in
            ''|anthropic)
              echo "KIT_TRIAGE_PROVIDER=anthropic" >> "$GITHUB_ENV"
              echo "KIT_TRIAGE_PROVIDER=anthropic"
              model KIT_TRIAGE_MODEL "$MODEL" claude-sonnet-5-5 ;;
            opencode-go)
              echo "KIT_TRIAGE_PROVIDER=opencode-go" >> "$GITHUB_ENV"
              echo "KIT_TRIAGE_PROVIDER=opencode-go"
              go_model KIT_TRIAGE_MODEL "$MODEL" deepseek-v4.1-flash ;;
            *)
              echo "::error::the setting KIT_TRIAGE_PROVIDER must be anthropic, opencode-go or unset, not '$PROVIDER' ($(from KIT_TRIAGE_PROVIDER))"
              exit 1 ;;
          esac
          effort KIT_TRIAGE_EFFORT "$EFFORT"
          number KIT_TRIAGE_MAX_TURNS "$MAX_TURNS" 40 500
          # The triage job's timeout-minutes; a value outside 1 to 360
          # (GitHub-hosted jobs stop at 6 hours) fails here, before it starts.
          number KIT_TRIAGE_TIMEOUT_MINUTES "$TIMEOUT" 15 360
      # The checked values, or the ones read when the workflow is off.
      - name: Pass the settings on
        id: pass
        run: |
          for name in $SETTINGS; do
            printf '%s=%s\n' "$name" "${!name}" >> "$GITHUB_OUTPUT"
          done

  triage:
    # Job-level concurrency: a run whose job is skipped (a label other than
    # needs-triage) never cancels a triage in flight.
    concurrency:
      group: issue-triage-${{ github.event.issue.number || github.event.inputs.issue || 'sweep' }}
      cancel-in-progress: true
    needs: settings
    if: needs.settings.outputs.KIT_ISSUE_TRIAGE == 'on'
    runs-on: ubuntu-latest
    # Checked by the settings job, which fails on a value outside 1 to 360.
    timeout-minutes: ${{ fromJSON(needs.settings.outputs.KIT_TRIAGE_TIMEOUT_MINUTES || '15') }}
    # The runner context is not available in a job's env (GitHub's context
    # availability table), so the two files under the runner's temp
    # directory are named by the first step below.
    env:
      TRIAGE_ISSUE: ${{ github.event.issue.number || github.event.inputs.issue }}
      KIT_ISSUE_TRIAGE: ${{ needs.settings.outputs.KIT_ISSUE_TRIAGE }}
      KIT_TRIAGE_PROVIDER: ${{ needs.settings.outputs.KIT_TRIAGE_PROVIDER }}
      KIT_TRIAGE_RUNNER: ${{ needs.settings.outputs.KIT_TRIAGE_RUNNER }}
      KIT_TRIAGE_MODEL: ${{ needs.settings.outputs.KIT_TRIAGE_MODEL }}
      KIT_TRIAGE_EFFORT: ${{ needs.settings.outputs.KIT_TRIAGE_EFFORT }}
      KIT_TRIAGE_MAX_TURNS: ${{ needs.settings.outputs.KIT_TRIAGE_MAX_TURNS }}
      KIT_TRIAGE_TIMEOUT_MINUTES: ${{ needs.settings.outputs.KIT_TRIAGE_TIMEOUT_MINUTES }}
      TRIAGE_EVENT: ${{ github.event.action || 'dispatch' }}
    steps:
      # anthropics/claude-code-action refused an issue event whose actor
      # lacked write access (docs/security.md at v1.0.256); this step keeps
      # that gate. On every single-issue run, the issue's author needs
      # write access for the model to read the issue's text, since that
      # text can try to steer it (the sweep leaves such issues out, above,
      # but this holds for a dispatch by hand too); on an issue event the
      # actor (its editor or labeller) needs it as well. The permission
      # field reports the base role: maintain as write, triage as read
      # (docs.github.com, "Get repository permissions for a user", read
      # 2026-10-21); a 404 (a login GitHub no longer resolves for this
      # repository) counts as no access, as in the sweep. The dispatch
      # itself is gated by GitHub: dispatching needs write access, and the
      # sweep's dispatches run with the job token, so the actor of a
      # dispatched run is not checked. Comments on the issue are not gated
      # here: the server withholds the text of one whose author lacks write
      # access, by the same rule (mcp-server.mjs, withheldReason). First, so
      # a refused event costs no checkout or setup.
      #
      # On an issue event the refusal is a skip, not a failure: anyone can
      # open or edit an issue on a public repository, and each such event
      # would otherwise leave a red run. The step prints a notice, sets
      # skip, and every later step's if: checks it, so the job ends green
      # with the rest skipped. A dispatch by hand of such an issue still
      # fails, since someone asked for that run.
      - name: Refuse an issue whose author, or an issue event whose actor, lacks write access
        id: gate
        if: env.TRIAGE_ISSUE != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
        run: |
          author=$(gh api --method GET "repos/$REPO/issues/$TRIAGE_ISSUE" --jq .user.login)
          logins="$author"
          if [ "$EVENT" = "issues" ]; then logins="$author $ACTOR"; fi
          for login in $logins; do
            if permission=$(gh api --method GET "repos/$REPO/collaborators/$login/permission" --jq .permission 2>"$RUNNER_TEMP/permission-error"); then
              :
            elif grep -q 'HTTP 404' "$RUNNER_TEMP/permission-error"; then
              permission=none
            else
              cat "$RUNNER_TEMP/permission-error" >&2
              exit 1
            fi
            case "$permission" in
              admin|write) echo "$login: $permission" ;;
              *)
                if [ "$EVENT" = "issues" ]; then
                  echo "::notice::$login has '$permission' access to $REPO, not write; not triaged"
                  echo "skip=true" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                echo "::error::$login has '$permission' access to $REPO, not write; not triaged"
                exit 1
                ;;
            esac
          done
      # No step needs git credentials, so keep the job token out of the
      # checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.skip != 'true'
        with:
          fetch-depth: 1
          persist-credentials: false
      # A run that handles one issue reads and writes only through the MCP
      # server, which takes the issue number from TRIAGE_ISSUE and the event
      # from TRIAGE_EVENT and offers named label moves and one comment per
      # run; the model has no shell, no file-writing tool and no network
      # tool, so gh (whose subcommands accept --web, which launches a
      # configured program with the token) is never in its hands. The
      # server runs from a root-owned copy outside the checkout, so nothing
      # in the checkout is executed. The sweep reads the list the workflow
      # wrote and dispatches a run per issue through the server's dispatch
      # tool, which pins the run to this branch (gh workflow run would
      # accept --ref, and so a branch's edited workflow); it writes nothing
      # else. The issue number is validated before it reaches the server's
      # environment, because a dispatch input could otherwise rewrite it.
      - name: Scope the bot's tools to this run
        if: steps.gate.outputs.skip != 'true'
        env:
          ISSUE: ${{ github.event.issue.number || github.event.inputs.issue }}
        run: |
          case "$ISSUE" in
            *[!0-9]*) echo "::error::issue must be a number, got '$ISSUE'"; exit 1 ;;
          esac
          echo "DISPATCH_LOG=$RUNNER_TEMP/dispatched" >> "$GITHUB_ENV"
          echo "ELIGIBLE_ISSUES=$RUNNER_TEMP/eligible-issues" >> "$GITHUB_ENV"
          sudo install -d -o root -g root -m 0755 /opt/agent-kit
          sudo install -o root -g root -m 0755 .github/scripts/mcp-server.mjs /opt/agent-kit/mcp-server.mjs
          # The model gets no Bash, no file-writing tool and no network
          # tool; its file reads stay inside the checkout and out of .git.
          echo "DENIED=Bash,Edit,Write,NotebookEdit,WebFetch,WebSearch,Read(//proc/**),Read(//dev/**),Read(//${GITHUB_WORKSPACE#/}/.git/**)" >> "$GITHUB_ENV"
          if [ -n "$ISSUE" ]; then
            echo "MCP_MODE=triage" >> "$GITHUB_ENV"
            echo "ALLOWED=Read,Grep,Glob,mcp__agent-kit__view,mcp__agent-kit__comments,mcp__agent-kit__comment_body,mcp__agent-kit__search,mcp__agent-kit__read_issue,mcp__agent-kit__open_prs,mcp__agent-kit__info,mcp__agent-kit__add_label,mcp__agent-kit__remove_label,mcp__agent-kit__comment" >> "$GITHUB_ENV"
          else
            echo "MCP_MODE=sweep" >> "$GITHUB_ENV"
            echo "ALLOWED=mcp__agent-kit__list_eligible,mcp__agent-kit__dispatch" >> "$GITHUB_ENV"
          fi
      # The sweep's candidates are computed here, not by the model: every
      # open issue labelled needs-triage, carrying no state label, or
      # labelled in-progress with no activity for 7 days. The dispatch
      # script starts a run only for a number in this list, once.
      - name: List the issues a sweep dispatches
        if: env.TRIAGE_ISSUE == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Every page (the issues endpoint also lists pull requests; drop
          # them), so no open issue falls past a fetch limit.
          gh api --paginate "repos/$REPO/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request == null and .user.type != "Bot") | select(
                (.labels | map(.name) | index("needs-triage")) != null
                or ((.labels | map(.name)) - ["needs-triage","triaged","ready","in-progress","blocked","needs-operator"] | length) == (.labels | length)
                or ((.labels | map(.name) | index("in-progress")) != null and (now - (.updated_at | fromdate)) > 7 * 86400)
              ) | .number' | sort -n > "$RUNNER_TEMP/candidates"
          : > "$DISPATCH_LOG"
          # A stale in-progress claim that already carries the warning is not
          # dispatched again: the warning is posted once.
          : > "$ELIGIBLE_ISSUES"
          while IFS= read -r n; do
            [ -n "$n" ] || continue
            # Plain assignments: a failed call fails the sweep (a process
            # substitution or an || fallback would quietly drop the issue).
            # Labels one a line: a label name may contain a comma or a space.
            info=$(gh api --method GET "repos/$REPO/issues/$n" --jq '.user.login, .labels[].name')
            author=$(head -n 1 <<<"$info")
            labels=$(tail -n +2 <<<"$info")
            # An issue whose author lacks write access is not dispatched:
            # the gate below would refuse its run (every sweep, until an
            # operator handles the issue), so it is left out here too. A
            # 404 (a login GitHub no longer resolves for this repository)
            # counts as no access, so one such issue cannot stall every
            # sweep; any other failure fails the sweep.
            if permission=$(gh api --method GET "repos/$REPO/collaborators/$author/permission" --jq .permission 2>"$RUNNER_TEMP/permission-error"); then
              :
            elif grep -q 'HTTP 404' "$RUNNER_TEMP/permission-error"; then
              permission=none
            else
              cat "$RUNNER_TEMP/permission-error" >&2
              exit 1
            fi
            case "$permission" in
              admin|write) ;;
              *) echo "#$n: author $author has '$permission' access, not write; not dispatched"; continue ;;
            esac
            if grep -qxF -- in-progress <<<"$labels" && ! grep -qxF -- needs-triage <<<"$labels"; then
              warned=$(gh api --paginate "repos/$REPO/issues/$n/comments" \
                --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | split("\n") | index("## Triage: stale claim")) != null) | .id' | wc -l)
              [ "$warned" -eq 0 ] || continue
            fi
            echo "$n" >> "$ELIGIBLE_ISSUES"
          done < "$RUNNER_TEMP/candidates"
          echo "eligible: $(tr '\n' ' ' < "$ELIGIBLE_ISSUES")"
      # The model's GitHub reads and writes go through the MCP server in
      # .github/scripts/mcp-server.mjs (installed root-owned above), which
      # Claude Code starts from the --mcp-config below. The token is not in
      # that configuration (which is on Claude Code's command line) but in
      # a file the runner user alone can read, outside the checkout, which
      # the server reads at startup into its own environment. The model
      # itself gets no Bash, no file-writing tool and no network tool; its
      # file reads stay inside the checkout
      # (blockReadsOutsideWorkingDirectories); and its own process and
      # subprocesses see empty GH_TOKEN and GITHUB_TOKEN. The server keeps
      # what the run has posted in a file beside the token's (STATE_FILE),
      # and the sweep's dispatches in DISPATCH_LOG, so its per-run limits
      # hold when OpenCode carries the run on in a new process.
      - name: Write the model's settings and the MCP server's configuration
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          cat > "$RUNNER_TEMP/claude-settings.json" <<EOF
          {
            "permissions": {
              "blockReadsOutsideWorkingDirectories": true,
              "deny": ["Bash", "Edit", "Write", "NotebookEdit", "WebFetch", "WebSearch", "Read(//proc/**)", "Read(//dev/**)", "Read(//${GITHUB_WORKSPACE#/}/.git/**)"]
            },
            "env": { "GH_TOKEN": "", "GITHUB_TOKEN": "" }
          }
          EOF
          cat "$RUNNER_TEMP/claude-settings.json"
          (umask 077 && printf '%s' "$GH_TOKEN" > "$RUNNER_TEMP/gh-token")
          mcp=$(jq -cn --arg tokenfile "$RUNNER_TEMP/gh-token" --arg repo "$REPO" --arg mode "$MCP_MODE" --arg issue "$TRIAGE_ISSUE" --arg event "$TRIAGE_EVENT" \
            --arg eligible "$ELIGIBLE_ISSUES" --arg log "$DISPATCH_LOG" --arg ref "$GITHUB_REF_NAME" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg state "$RUNNER_TEMP/agent-kit-state.json" \
            '{mcpServers: {"agent-kit": {command: "node", args: ["/opt/agent-kit/mcp-server.mjs", $mode], env: {GH_TOKEN_FILE: $tokenfile, GITHUB_REPOSITORY: $repo, TRIAGE_ISSUE: $issue, TRIAGE_EVENT: $event, ELIGIBLE_ISSUES: $eligible, DISPATCH_LOG: $log, GITHUB_REF_NAME: $ref, GITHUB_RUN_ID: $run, GITHUB_RUN_ATTEMPT: $attempt, STATE_FILE: $state}}}}')
          echo "MCP_CONFIG=$mcp" >> "$GITHUB_ENV"
      # CLAUDE_CODE_SUBPROCESS_ENV_SCRUB needs bubblewrap on Linux, or Claude
      # Code exits at startup (anthropics/claude-code#96664, open 2026-10-21).
      # This is the step anthropics/claude-code-action runs on its
      # allowed_non_write_users path (v1.0.256), including its Ubuntu 24.04
      # AppArmor relaxation.
      - name: Install subprocess isolation dependencies
        if: env.KIT_TRIAGE_RUNNER != 'opencode' && steps.gate.outputs.skip != 'true'
        run: |
          # The image ships apt sources the kit does not use, and one failing
          # (a 403 from packages.microsoft.com on 2026-10-22) fails the
          # update while the Ubuntu archive's lists still refresh. Retry once,
          # then go on: the install below still fails the step when bubblewrap
          # or socat cannot be installed.
          sudo apt-get update -qq || sudo apt-get update -qq ||
            echo "::warning::apt-get update failed; installing from the package lists it fetched"
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # RETRIAGE records, before the run can remove it, whether a dispatched
      # issue carries needs-triage: that is the operator asking for a fresh
      # plan, which resets an approval (the post-step below checks this).
      # STALE records whether a dispatched in-progress issue had been idle
      # for 7 days when the run started (the run's own comment moves the
      # date): a fresher claim, made after the sweep listed the issue, is
      # left alone.
      - name: Record when the run started
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          retriage=false; stale=false
          if [ -n "$TRIAGE_ISSUE" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            read -r has_nt has_ip updated < <(gh api --method GET "repos/$REPO/issues/$TRIAGE_ISSUE" \
              --jq '"\([.labels[].name] | index("needs-triage") != null) \([.labels[].name] | index("in-progress") != null) \(.updated_at)"')
            [ "$has_nt" = "true" ] && retriage=true
            if [ "$has_ip" = "true" ] && [ "$(date -u -d "$updated" +%s)" -le "$(( $(date -u +%s) - 7 * 86400 ))" ]; then
              stale=true
            fi
          fi
          echo "RETRIAGE=$retriage" >> "$GITHUB_ENV"
          echo "STALE=$stale" >> "$GITHUB_ENV"
      # Claude Code runs directly, not through anthropics/claude-code-action,
      # as in the review workflow's "Install Claude Code" step: the workflow
      # pins the exact CLI release and sets every flag the run gets. Same
      # pinned release, checked against the same signed manifest's
      # checksum; installed root-owned outside the checkout, like the
      # server. Move the pin as that step says, in the three workflows
      # together.
      - name: Install Claude Code
        if: env.KIT_TRIAGE_RUNNER != 'opencode' && steps.gate.outputs.skip != 'true'
        env:
          VERSION: 2.1.306
          SHA256: 520bc6c1f40af466bd03a278b5ae1af1a2938bc7de5b9e5cb15526da20d71cfe
        # The bucket rate-limits (HTTP 429) when several runs download at
        # once, and an HTTP/2 stream can drop mid-transfer (curl exit 92),
        # which curl does not count as transient. So every failure is
        # retried, with curl's doubling backoff (1 s, 2 s, ... 128 s) for
        # up to about 5 minutes; a lasting failure, such as a 404 for a bad
        # pin, fails the step only then. The checksum below still decides.
        run: |
          curl -fsSL --retry 8 --retry-all-errors --retry-max-time 300 \
            -o "$RUNNER_TEMP/claude" \
            "https://downloads.claude.ai/claude-code-releases/$VERSION/linux-x64/claude"
          echo "$SHA256  $RUNNER_TEMP/claude" | sha256sum -c -
          sudo install -o root -g root -m 0755 "$RUNNER_TEMP/claude" /opt/agent-kit/claude
          rm -f -- "$RUNNER_TEMP/claude"
          DISABLE_AUTOUPDATER=1 /opt/agent-kit/claude --version
      # OpenCode 1.19.3 imports the plugins a checkout names, in
      # .opencode/plugin, .opencode/plugins and the plugin list of an
      # opencode.json or opencode.jsonc, even with
      # OPENCODE_DISABLE_PROJECT_CONFIG and OPENCODE_PURE set (tried
      # 2026-10-28), as pr-review.yml's step of the same name says. So on
      # the opencode runner they go before the CLI first runs, as in the
      # review and the scan; triage needs none of them.
      - name: Remove the checkout's OpenCode configuration
        if: env.KIT_TRIAGE_RUNNER == 'opencode' && steps.gate.outputs.skip != 'true'
        run: |
          rm -rf -- .opencode opencode.json opencode.jsonc
      # On the opencode runner the model runs in OpenCode's CLI
      # instead, which reaches every OpenCode Go model its pinned release
      # lists, including those Go serves only on its OpenAI-style endpoints
      # (opencode.ai/docs/go, Endpoints). The pinned release is the linux-x64 build from the
      # project's GitHub releases (anomalyco/opencode, v1.19.3 published
      # 2026-10-16), and the binary is checked against its SHA-256 (the
      # same binary as npm's opencode-linux-x64@1.19.3, compared
      # 2026-10-26); installed root-owned outside the checkout, like
      # Claude Code. Retried the same way as Claude Code's download.
      - name: Install OpenCode
        if: env.KIT_TRIAGE_RUNNER == 'opencode' && steps.gate.outputs.skip != 'true'
        env:
          VERSION: 1.19.3
          SHA256: 179ca421d61eefeadfa0c50e084a6e79c1623734732f0f4593f81ccfd3ab7ee9
        run: |
          curl -fsSL --retry 8 --retry-all-errors --retry-max-time 300 \
            -o "$RUNNER_TEMP/opencode.tar.gz" \
            "https://github.com/anomalyco/opencode/releases/download/v$VERSION/opencode-linux-x64.tar.gz"
          mkdir "$RUNNER_TEMP/opencode-release"
          tar -xzf "$RUNNER_TEMP/opencode.tar.gz" -C "$RUNNER_TEMP/opencode-release" opencode
          echo "$SHA256  $RUNNER_TEMP/opencode-release/opencode" | sha256sum -c -
          sudo install -o root -g root -m 0755 "$RUNNER_TEMP/opencode-release/opencode" /opt/agent-kit/opencode
          rm -rf -- "$RUNNER_TEMP/opencode.tar.gz" "$RUNNER_TEMP/opencode-release"
          HOME="$RUNNER_TEMP" OPENCODE_DISABLE_AUTOUPDATE=1 /opt/agent-kit/opencode --version
      # The model runs no shell command and no gh command of its own:
      # every read and every write are MCP tools of the server above.
      # --restricted drops the code-running tools and ignores the user,
      # project and local settings files (the one passed with --settings
      # still applies), --strict-mcp-config ignores every MCP server but
      # the one on the command line, and --permission-prompts none denies
      # whatever would otherwise prompt. The JSON result is kept for the
      # checks below: a run whose result is an error (a rejected model, an
      # API refusal, the turn limit) fails here, and its message is printed
      # so the log says why. GitHub masks secrets in step output. A run
      # without its provider's key fails before the CLI starts, naming the
      # missing secret.
      #
      # With KIT_TRIAGE_PROVIDER=opencode-go the same CLI talks to OpenCode
      # Go's Anthropic Messages endpoint, set up as the review workflow's
      # "Run the review" step says: the Go base URL, the key as
      # ANTHROPIC_AUTH_TOKEN, every model alias mapped to the triage model,
      # and experimental betas and MCP tool search off.
      - name: Run the triage
        if: env.KIT_TRIAGE_RUNNER == 'claude-code' && steps.gate.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # Keep the key out of the processes Claude Code starts.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          DISABLE_AUTOUPDATER: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          PROMPT: "Read .agents/skills/github-issue-triage/SKILL.md and follow it as invoked by: /github-issue-triage ${{ github.repository }} ${{ github.event.issue.number || github.event.inputs.issue || 'sweep' }} ${{ github.event.action || 'dispatch' }}"
          RESULT: ${{ runner.temp }}/claude-result.json
        run: |
          if [ "$KIT_TRIAGE_PROVIDER" = opencode-go ]; then
            if [ -z "$OPENCODE_API_KEY" ]; then
              echo "::error::KIT_TRIAGE_PROVIDER is opencode-go but the OPENCODE_API_KEY secret is not set"
              exit 1
            fi
            export ANTHROPIC_BASE_URL=https://opencode.ai/inference/go/anthropic
            export ANTHROPIC_AUTH_TOKEN="$OPENCODE_API_KEY"
            export ANTHROPIC_DEFAULT_OPUS_MODEL="$KIT_TRIAGE_MODEL"
            export ANTHROPIC_DEFAULT_SONNET_MODEL="$KIT_TRIAGE_MODEL"
            export ANTHROPIC_DEFAULT_HAIKU_MODEL="$KIT_TRIAGE_MODEL"
            export CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS=1
            export ENABLE_TOOL_SEARCH=false
            unset ANTHROPIC_API_KEY
          elif [ -z "$ANTHROPIC_API_KEY" ]; then
            hint=""
            [ -z "$OPENCODE_API_KEY" ] || hint=", or set KIT_TRIAGE_PROVIDER to opencode-go to use the OPENCODE_API_KEY secret instead"
            echo "::error::KIT_TRIAGE_PROVIDER is anthropic (the default) but the ANTHROPIC_API_KEY secret is not set; add that secret$hint"
            exit 1
          fi
          unset OPENCODE_API_KEY
          status=0
          effort=()
          [ -z "$KIT_TRIAGE_EFFORT" ] || effort=(--effort "$KIT_TRIAGE_EFFORT")
          /opt/agent-kit/claude -p "$PROMPT" \
            --output-format json \
            --model "$KIT_TRIAGE_MODEL" \
            "${effort[@]}" \
            --max-turns "$KIT_TRIAGE_MAX_TURNS" \
            --restricted \
            --strict-mcp-config \
            --permission-prompts none \
            --no-session-persistence \
            --settings "$RUNNER_TEMP/claude-settings.json" \
            --mcp-config "$MCP_CONFIG" \
            --disallowedTools "$DENIED" \
            --allowedTools "$ALLOWED" \
            > "$RESULT" || status=$?
          if [ ! -s "$RESULT" ]; then
            echo "::error::Claude Code exited with status $status and no result"
            exit 1
          fi
          # The result object (a stream would be an array; keep the last result).
          result=$(jq -c '(if type == "array" then map(select(.type == "result")) | last else . end)' "$RESULT")
          # Claude Code prices every model as Claude, so on Go its cost
          # figure is not what Go charges; the token counts are, at the
          # model's prices on opencode.ai/docs/go.
          cost=cost_usd
          [ "$KIT_TRIAGE_PROVIDER" != opencode-go ] || cost="cost_usd (Claude prices, not Go's)"
          # The model's last message, with workflow commands stopped: text the
          # issue steered could otherwise annotate or mask the log.
          stop=$(openssl rand -hex 16)
          echo "::stop-commands::$stop"
          jq -r --arg cost "$cost" '"subtype: \(.subtype)\nis_error: \(.is_error)\nturns: \(.num_turns)\n\($cost): \(.total_cost_usd)\ntokens: input \(.usage.input_tokens), cache read \(.usage.cache_read_input_tokens), cache write \(.usage.cache_creation_input_tokens), output \(.usage.output_tokens)\nerrors: \(.errors // [] | join("; "))\nresult: \((.result // "") | .[0:2000])"' <<<"$result"
          echo "::$stop::"
          if [ "$status" -ne 0 ] || [ "$(jq -r '.is_error' <<<"$result")" != "false" ] || [ "$(jq -r '.subtype' <<<"$result")" != "success" ]; then
            echo "::error::Claude Code's run ended in error (exit status $status)"
            exit 1
          fi
      # OpenCode's grep and glob tools take a path inside the checkout and
      # are checked only against their pattern, so the read rules for .git
      # do not cover them, and its read tool follows a symlink that leads
      # out of the checkout. So on the opencode runner, .git moves out of
      # the checkout (the server's triage and sweep tools use gh, not git)
      # and every symlink is removed, as the security scan does. Paths
      # outside the checkout stay denied, and without .git OpenCode still
      # scopes them to it (tried with 1.19.3, 2026-10-26). A later step puts
      # .git back for the checkout action's cleanup, as the review and the
      # scan do.
      - name: Hide .git and the checkout's symlinks from OpenCode
        if: env.KIT_TRIAGE_RUNNER == 'opencode' && steps.gate.outputs.skip != 'true'
        run: |
          mv -- .git "$RUNNER_TEMP/checkout-git"
          find . -type l -print0 | while IFS= read -r -d '' link; do
            rm -f -- "$link"
            echo "removed a symlink: ${link//[$'\r\n']/ }"
          done
      # The same run on OpenCode's CLI (the opencode runner), held
      # to what the Claude Code run allows (opencode.ai/docs: config,
      # permissions, mcp-servers and cli, read 2026-10-26):
      #
      # - Its configuration is the one in OPENCODE_CONFIG_CONTENT, which
      #   outranks a project's own; OPENCODE_DISABLE_PROJECT_CONFIG leaves
      #   out the checkout's settings, OPENCODE_PURE loads no external
      #   plugins, and HOME and the XDG directories point at an empty
      #   directory, so no global configuration or saved login is read. The
      #   checkout's own plugins still load with both set, so they are
      #   removed first (see "Remove the checkout's OpenCode
      #   configuration"). The checkout's .claude and external
      #   skills are not loaded either: the prompt names the skill file, as
      #   for Claude Code.
      # - Every permission is denied, and only read, grep and glob (which
      #   Claude Code offers without asking, the sweep included) and the
      #   server's tools that ALLOWED names, as agent-kit_<tool>, are
      #   allowed again. A denied tool is not offered to the model at all.
      #   Paths outside the checkout are denied (external_directory, which
      #   defaults to ask), so no rule is left at ask, whose effect in a
      #   run without a terminal the docs do not give. The read rules for
      #   .git hold only for the read tool: grep takes a path and checks
      #   only its pattern, so the step before this one moves .git out of
      #   the checkout.
      # - The MCP server starts through env -i with PATH, HOME,
      #   GITHUB_WORKSPACE and the variables of its own configuration, so
      #   the Go key in OpenCode's environment never reaches it; the model
      #   has no tool that starts a process.
      # - agent.build.steps is the turn limit. OpenCode ends a run that
      #   reaches it with a text answer and exit status 0, so a run that
      #   used every step fails here, as Claude Code's does at --max-turns.
      #   An error event (a refused key or model, an API failure) or a
      #   last step that did not stop on its own fails it as well, but for
      #   Go's capacity refusal, after which the run carries on (below).
      # - small_model is the triage model too, so the session title
      #   OpenCode generates does not go to another model.
      # - OpenCode installs its plugin package from npm into its config
      #   directory in the background (seen on 1.19.3, 2026-10-26; no
      #   setting found turns it off). OPENCODE_PURE loads no external
      #   plugin, so none of it runs.
      #
      # Cost and tokens are OpenCode's own, at Go's prices.
      - name: Run the triage on OpenCode
        if: env.KIT_TRIAGE_RUNNER == 'opencode' && steps.gate.outputs.skip != 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          PROMPT: "Read .agents/skills/github-issue-triage/SKILL.md and follow it as invoked by: /github-issue-triage ${{ github.repository }} ${{ github.event.issue.number || github.event.inputs.issue || 'sweep' }} ${{ github.event.action || 'dispatch' }}"
          RESULT: ${{ runner.temp }}/opencode-events.jsonl
        run: |
          if [ -z "$OPENCODE_API_KEY" ]; then
            echo "::error::KIT_TRIAGE_RUNNER is opencode but the OPENCODE_API_KEY secret is not set"
            exit 1
          fi
          node=$(command -v node)
          permission=$(jq -cn --arg allowed "$ALLOWED" '
            {"*": "deny", external_directory: "deny",
             read: {"*": "allow", ".git": "deny", ".git/*": "deny"},
             grep: "allow", glob: "allow"} +
            ([$allowed | split(",")[] |
              if . == "Read" or . == "Grep" or . == "Glob" then {}
              elif startswith("mcp__agent-kit__") then {("agent-kit_" + ltrimstr("mcp__agent-kit__")): "allow"}
              else error("no OpenCode permission for the allowed tool \(.)") end] | add)')
          server=$(jq -c --arg node "$node" --arg path "$PATH" --arg home "$HOME" --arg workspace "$GITHUB_WORKSPACE" '
            .mcpServers["agent-kit"] |
            ["/usr/bin/env", "-i", "PATH=\($path)", "HOME=\($home)", "GITHUB_WORKSPACE=\($workspace)"]
            + (.env | to_entries | map("\(.key)=\(.value)")) + [$node] + .args' <<<"$MCP_CONFIG")
          config=$(jq -cn --arg model "opencode-go/$KIT_TRIAGE_MODEL" --argjson steps "$KIT_TRIAGE_MAX_TURNS" \
            --argjson permission "$permission" --argjson server "$server" '{
              "$schema": "https://opencode.ai/config.json",
              autoupdate: false, share: "disabled", lsp: false, formatter: false,
              model: $model, small_model: $model,
              provider: {"opencode-go": {options: {apiKey: "{env:OPENCODE_API_KEY}"}}},
              mcp: {"agent-kit": {type: "local", command: $server, timeout: 120000}},
              permission: $permission,
              agent: {build: {steps: $steps}}
            }')
          echo "$config" | jq '{model, permission, agent, mcp_command: .mcp["agent-kit"].command[0:5]}'
          home="$RUNNER_TEMP/opencode-home"
          mkdir -p "$home"
          # The CLI with the configuration in $1 and the empty home.
          oc() {
            local config=$1
            shift
            HOME="$home" XDG_CONFIG_HOME="$home/config" XDG_DATA_HOME="$home/data" \
              XDG_CACHE_HOME="$home/cache" XDG_STATE_HOME="$home/state" \
              OPENCODE_CONFIG_CONTENT="$config" \
              OPENCODE_DISABLE_PROJECT_CONFIG=1 OPENCODE_PURE=1 OPENCODE_DISABLE_CLAUDE_CODE=1 \
              OPENCODE_DISABLE_EXTERNAL_SKILLS=1 OPENCODE_DISABLE_AUTOUPDATE=1 \
              OPENCODE_DISABLE_LSP_DOWNLOAD=1 OPENCODE_DISABLE_MODELS_FETCH=1 \
              GH_TOKEN="" GITHUB_TOKEN="" \
              /opt/agent-kit/opencode "$@"
          }
          # The model's entry in the pinned CLI's own model list (no newer
          # list is fetched), and the effort level as one of its variants:
          # OpenCode runs a variant the model lacks without any, silently.
          list=$(jq -cn '{provider: {"opencode-go": {options: {apiKey: "{env:OPENCODE_API_KEY}"}}}}')
          listed=0
          oc "$list" models opencode-go --verbose > "$RUNNER_TEMP/opencode-models" \
            2> "$RUNNER_TEMP/opencode-models-stderr" || listed=$?
          if [ "$listed" -ne 0 ]; then
            tail -n 20 "$RUNNER_TEMP/opencode-models-stderr" >&2
            echo "::error::OpenCode could not list its models (exit status $listed), so KIT_TRIAGE_MODEL could not be checked"
            exit 1
          fi
          info=$(awk -v want="opencode-go/$KIT_TRIAGE_MODEL" '$0 == want { on = 1; next } on && /^[^ {}"]+\/[^ ]+$/ { exit } on' "$RUNNER_TEMP/opencode-models")
          if ! jq -e 'type == "object"' >/dev/null 2>&1 <<<"$info"; then
            echo "::error::the setting KIT_TRIAGE_MODEL is '$KIT_TRIAGE_MODEL', which the pinned OpenCode does not list for OpenCode Go"
            exit 1
          fi
          variant=()
          if [ -n "$KIT_TRIAGE_EFFORT" ]; then
            if ! jq -e --arg v "$KIT_TRIAGE_EFFORT" '.variants // {} | has($v)' >/dev/null <<<"$info"; then
              echo "::error::the setting KIT_TRIAGE_EFFORT is '$KIT_TRIAGE_EFFORT', which OpenCode does not offer for $KIT_TRIAGE_MODEL; it offers $(jq -r '.variants // {} | keys | if length == 0 then "none" else join(", ") end' <<<"$info"), or leave it unset"
              exit 1
            fi
            variant=(--variant "$KIT_TRIAGE_EFFORT")
          fi
          echo "variant: ${KIT_TRIAGE_EFFORT:-none, so the model default applies}"
          # Go turns a request away when the model's servers are full:
          # "[ttft_admission_refused] the cell is at capacity; retry shortly
          # (after 16 s)" (2026-10-28). 1.19.3 retries a request whose error
          # it counts as retryable five times, about a minute of waiting in
          # all (its session retry policy), but on 2026-10-28 runs still
          # ended on that refusal. So after a refusal the run carries on in
          # the same session (--session), told why, with the steps it has
          # left, after the wait the refusal names (a minute at most, half a
          # minute when it names none), three times in the step at most. The
          # refused step is left out of what the model is sent next, and the
          # steps before it stay (1.19.3's message history). RESULT gets every
          # attempt's events; the exit status and errors are the last
          # attempt's.
          : > "$RESULT"
          refusals=0
          session=""
          run_config=$config
          resume=()
          text=$PROMPT
          while :; do
            status=0
            oc "$run_config" run --print-logs --format json -m "opencode-go/$KIT_TRIAGE_MODEL" "${variant[@]}" "${resume[@]}" "$text" \
              > "$RUNNER_TEMP/opencode-attempt.jsonl" 2> "$RUNNER_TEMP/opencode-stderr" || status=$?
            # One JSON event a line; anything else on stdout is left out.
            jq -cR 'fromjson? | objects' "$RUNNER_TEMP/opencode-attempt.jsonl" > "$RUNNER_TEMP/opencode-attempt-events.jsonl"
            cat "$RUNNER_TEMP/opencode-attempt-events.jsonl" >> "$RESULT"
            # The seconds to wait when the attempt ended on that refusal.
            pause=$(jq -rs 'map(select(.type == "error")) | last // empty | .error | tostring
              | select(test("ttft_admission_refused|at capacity"))
              | ((capture("after (?<s>[0-9]+) ?s\\b").s | tonumber) // 30) | if . > 60 then 60 else . end' \
              "$RUNNER_TEMP/opencode-attempt-events.jsonl")
            session=$(jq -rs 'map(.sessionID // empty | strings) | first // empty' "$RESULT")
            left=$(( KIT_TRIAGE_MAX_TURNS - $(jq -s 'map(select(.type == "step_start")) | length' "$RESULT") ))
            if [ -z "$pause" ] || [ "$refusals" -ge 3 ] || [ -z "$session" ] || [ "$left" -le 0 ]; then
              break
            fi
            refusals=$((refusals + 1))
            echo "::warning::OpenCode Go turned a request away as at capacity, so the run carries on in the same session in $pause s (refusal $refusals of the step's 3)"
            sleep "$pause"
            run_config=$(jq -c --argjson steps "$left" '.agent.build.steps = $steps' <<<"$config")
            resume=(--session "$session")
            text="OpenCode Go turned your last request away because it was at capacity, so your work stopped there. Carry on with the same task from where it stopped: the work you have done is in this session, so do not start again."
          done
          events=$(cat "$RESULT")
          if [ -z "$events" ]; then
            stop=$(openssl rand -hex 16)
            echo "::stop-commands::$stop"
            tail -n 50 "$RUNNER_TEMP/opencode-stderr" | awk 1
            echo "::$stop::"
            echo "::error::OpenCode exited with status $status and no events"
            exit 1
          fi
          summary=$(jq -s --slurpfile last "$RUNNER_TEMP/opencode-attempt-events.jsonl" '{
            steps: map(select(.type == "step_start")) | length,
            reason: (map(select(.type == "step_finish")) | last | .part.reason // ""),
            cost: (map(select(.type == "step_finish") | .part.cost // 0) | add // 0),
            input: (map(select(.type == "step_finish") | .part.tokens.input // 0) | add // 0),
            cache_read: (map(select(.type == "step_finish") | .part.tokens.cache.read // 0) | add // 0),
            cache_write: (map(select(.type == "step_finish") | .part.tokens.cache.write // 0) | add // 0),
            output: (map(select(.type == "step_finish") | .part.tokens.output // 0) | add // 0),
            reasoning: (map(select(.type == "step_finish") | .part.tokens.reasoning // 0) | add // 0),
            errors: ($last | map(select(.type == "error") | .error.data.message // .error.name // "error") | join("; ")),
            result: (map(select(.type == "text") | .part.text // "") | last // "")
          }' <<<"$events")
          # The model's last message, with workflow commands stopped: text the
          # issue steered could otherwise annotate or mask the log.
          stop=$(openssl rand -hex 16)
          echo "::stop-commands::$stop"
          jq -r '"steps: \(.steps)\nlast step: \(.reason)\ncost_usd (Go prices): \(.cost)\ntokens: input \(.input), cache read \(.cache_read), cache write \(.cache_write), output \(.output), reasoning \(.reasoning)\nerrors: \(.errors)\nresult: \(.result | .[0:2000])"' <<<"$summary"
          echo "::$stop::"
          if [ "$status" -ne 0 ] || [ -n "$(jq -r '.errors' <<<"$summary")" ] || [ "$(jq -r '.reason' <<<"$summary")" != "stop" ]; then
            # OpenCode's log, which --print-logs puts on its stderr (each
            # retry of a refused request is a "stream error" line), with
            # workflow commands stopped as above; awk ends its last line, so
            # the token below starts a line of its own.
            stop=$(openssl rand -hex 16)
            echo "::stop-commands::$stop"
            echo "OpenCode's log (its stderr), the last 50 lines:"
            tail -n 50 "$RUNNER_TEMP/opencode-stderr" | awk 1
            echo "::$stop::"
            echo "::error::OpenCode's run ended in error (exit status $status)"
            exit 1
          fi
          if [ "$(jq -r '.steps' <<<"$summary")" -ge "$KIT_TRIAGE_MAX_TURNS" ]; then
            echo "::error::OpenCode's run reached the turn limit (KIT_TRIAGE_MAX_TURNS=$KIT_TRIAGE_MAX_TURNS)"
            exit 1
          fi
      # Back where actions/checkout's post step cleans its configuration,
      # whether or not the run succeeded.
      - name: Put .git back in the checkout
        if: always() && env.KIT_TRIAGE_RUNNER == 'opencode' && steps.gate.outputs.skip != 'true'
        run: |
          if [ -d "$RUNNER_TEMP/checkout-git" ] && [ ! -e .git ]; then
            mv -- "$RUNNER_TEMP/checkout-git" .git
          fi
      - name: Remove the token file
        if: always() && steps.gate.outputs.skip != 'true'
        run: rm -f -- "$RUNNER_TEMP/gh-token"
      # Claude Code succeeds when its turn ends, whether or not the issue
      # was touched. Every single-issue path posts one comment and leaves
      # the labels in the state the skill names for its event; a run that
      # posted the comment but failed a label move must not pass. The paths
      # the skill ends without changes are exempt: a closed or bot-authored
      # issue, and an in-progress issue on any event but edited or reopened
      # (the dispatched stale check may have nothing to say).
      - name: Fail when the run left the issue in the wrong state
        if: env.TRIAGE_ISSUE != '' && steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
        run: |
          # Labels one a line and matched whole: a label name may contain a
          # comma or a space.
          issue=$(gh issue view "$TRIAGE_ISSUE" --repo "$REPO" --json state,author,labels)
          state=$(jq -r .state <<<"$issue")
          bot=$(jq -r .author.is_bot <<<"$issue")
          labels=$(jq -r '.labels[].name' <<<"$issue")
          shown=$(paste -sd ' ' - <<<"$labels")
          has() { grep -qxF -- "$1" <<<"$labels"; }
          count() { grep -cxE "$1" <<<"$labels" || true; }
          if [ "$state" = "CLOSED" ] || [ "$bot" = "true" ]; then
            exit 0
          fi
          # A re-triage (an edit, a reopen, needs-triage applied by the
          # operator, or a dispatch of an issue that carried it, recorded in
          # RETRIAGE at the start of the job since the run removes the
          # label) goes through the full check below, in-progress or not:
          # the skill resets the approval and posts a revised plan. Otherwise
          # an in-progress issue is left alone on an opened event (the skill
          # stops without changes), and on a dispatched run it gets the
          # stale check, which owes a "## Triage: stale claim" comment
          # unless an open pull request by an author with write access, or
          # by a GitHub App, closes the issue or that comment exists
          # already; a dispatched run also leaves an approved issue
          # alone, since a plan newer than the approval could not be claimed.
          case "$ACTION" in
            edited|reopened|labeled) ;;
            *)
              if [ "$RETRIAGE" = "true" ]; then
                :
              elif has in-progress && [ "$EVENT" != "workflow_dispatch" ]; then
                exit 0
              elif [ "$EVENT" = "workflow_dispatch" ] && ! has in-progress && { has agent:approved || has ready; }; then
                # An approved plan nobody has claimed stands; a claimed one
                # (agent:approved stays through the claim) gets the stale
                # check below.
                exit 0
              elif has in-progress && [ "$STALE" != "true" ]; then
                # Claimed after the sweep listed it: the skill stops without changes.
                exit 0
              elif has in-progress; then
                # A closing keyword before the number, as GitHub links it, on
                # a pull request into the default branch (GitHub ignores the
                # keyword on any other base); a mere mention does not close.
                # The repository name as a regex literal inside the jq string
                # (a dot would match any character).
                repo_jq=$(printf '%s' "$REPO" | sed 's/\./\\\\./g')
                # Every page of open pull requests into the default branch,
                # so no closing pull request falls past a fetch limit. The
                # branch name goes as a query field, encoded by gh (a name
                # may hold a character the URL would cut it at). Each closing
                # pull request's author, once, as account type and login.
                authors=$(gh api --paginate --method GET "repos/$REPO/pulls" -f state=open -f base="$(gh api --method GET "repos/$REPO" --jq .default_branch)" -F per_page=100 \
                  --jq ".[] | select(.body != null) | select(.body | test(\"\\\\b(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved):?\\\\s+(($repo_jq)?#|https://github\\\\.com/$repo_jq/issues/)$TRIAGE_ISSUE\\\\b\"; \"i\")) | \"\\(.user.type // \"-\") \\(.user.login // \"\")\"" \
                  | sort -u)
                # A closing pull request counts only when its author has
                # write access or is a GitHub App, as open_prs counts it:
                # anyone can write a closing keyword in a body. An unknown
                # author, a login that is not one, and a lookup that fails
                # or finds no access do not count.
                closing=0
                while read -r account login; do
                  [ -n "$account" ] || continue
                  if [ "$account" = Bot ] && [ -n "$login" ]; then
                    echo "closing pull request by $login, a GitHub App: counts"
                    closing=1
                    break
                  fi
                  if ! [[ "$login" =~ ^[A-Za-z0-9-]+(_[A-Za-z0-9]+)?$ ]]; then
                    echo "closing pull request by an unknown or malformed author: does not count"
                    continue
                  fi
                  # gh reads no input here: the loop's own is the list.
                  if ! permission=$(gh api --method GET "repos/$REPO/collaborators/$login/permission" --jq .permission </dev/null); then
                    echo "closing pull request by $login: the access lookup failed, so it does not count"
                    continue
                  fi
                  case "$permission" in
                    admin|write) echo "closing pull request by $login, $permission access: counts"; closing=1; break ;;
                    *) echo "closing pull request by $login, '$permission' access: does not count" ;;
                  esac
                done <<<"$authors"
                warned=$(gh api --paginate "repos/$REPO/issues/$TRIAGE_ISSUE/comments" \
                  --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | split(\"\\n\") | index(\"## Triage: stale claim\")) != null) | .created_at" | wc -l)
                # An earlier warning or this run's both satisfy the check.
                if [ "$closing" -gt 0 ] || [ "$warned" -gt 0 ]; then
                  exit 0
                fi
                echo "::error::the stale check on in-progress issue $TRIAGE_ISSUE found no closing pull request by an author with write access or a GitHub App and posted no '## Triage: stale claim' comment"
                exit 1
              fi
              ;;
          esac
          # This run's comment carries the marker the server appends with
          # this run's id and attempt (a re-run keeps the id): a timestamp
          # would also match a comment an older run on this issue posted in
          # the same second.
          posted=$(gh api --paginate "repos/$REPO/issues/$TRIAGE_ISSUE/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"<!-- issue-triage run $GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT -->\"))) | .body")
          if [ -z "$posted" ]; then
            echo "::error::triage posted no comment on issue $TRIAGE_ISSUE (labels: $shown)"
            exit 1
          fi
          fail() { echo "::error::issue $TRIAGE_ISSUE ended in the wrong state: $1 (labels: $shown)"; exit 1; }
          # The comment must be the triage itself, headed as the skill says
          # for the state the issue ends in, not any bot comment.
          if has needs-operator; then
            grep -qx '## Triage: questions' <<<"$posted" || fail "needs-operator without a '## Triage: questions' comment"
          else
            grep -qxE '## Triage( \(revised\))?' <<<"$posted" || fail "triaged without a '## Triage' or '## Triage (revised)' comment"
          fi
          has needs-triage && fail "needs-triage is still set"
          if ! has triaged && ! has needs-operator; then fail "neither triaged nor needs-operator is set"; fi
          if has triaged && has needs-operator; then fail "both triaged and needs-operator are set"; fi
          # Both outcomes carry one type and one priority (the questions
          # path applies the bot's best reading; the re-triage after the
          # answer may change them).
          [ "$(count 'bug|feature|chore|docs')" -eq 1 ] || fail "a triaged or needs-operator issue carries one type label"
          [ "$(count 'P[0-3]')" -eq 1 ] || fail "a triaged or needs-operator issue carries one priority label"
          # needs-triage on an approved issue is the operator asking for a
          # fresh plan, so the old approval goes with it on labeled events
          # and on a dispatch of an issue that carried the label.
          if [ "$ACTION" = edited ] || [ "$ACTION" = reopened ] || [ "$ACTION" = labeled ] || [ "$RETRIAGE" = true ]; then
            has agent:approved && fail "agent:approved survived a $ACTION event"
            has ready && fail "ready survived a $ACTION event"
          fi
          if [ "$ACTION" = "reopened" ] && has in-progress; then fail "in-progress survived a reopened event"; fi
      # The sweep ends successfully whether or not it dispatched anything.
      # the dispatch tool records each issue it started; every issue in
      # the list above must be in that record.
      - name: Fail when the sweep left an eligible issue undispatched
        if: env.TRIAGE_ISSUE == ''
        run: |
          missing=$(comm -23 <(sort "$ELIGIBLE_ISSUES") <(sort "$DISPATCH_LOG"))
          if [ -n "$missing" ]; then
            echo "::error::the sweep did not dispatch triage for issue(s): $(printf '%s' "$missing" | tr '\n' ' ')"
            exit 1
          fi
